# Nginx corre en el contenedor foxops-web, detrás de Traefik.
# El contenedor n8n debe estar unido a la red foxops_default con el alias n8n.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /webhook/foxops-contacto {
        limit_except POST { deny all; }

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $n8n_host n8n;
        proxy_pass http://$n8n_host:5678$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
